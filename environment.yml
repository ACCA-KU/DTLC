name: tlc
channels:
  - conda-forge
dependencies:
  - python=3.10
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu118
      - --find-links https://data.dgl.ai/wheels/cu118/repo.html
      - torch==2.1.2+cu118
      - torchvision==0.16.2+cu118
      - torchaudio==2.1.2+cu118
      - dgl==2.1.0+cu118
      - torch-geometric==2.6.1
      - torchdata==0.7.1
      - numpy==1.26.4
      - scipy==1.15.2
      - pandas==2.2.3
      - scikit-learn==1.6.1
      - matplotlib==3.10.6
      - networkx==2.8.8
      - rdkit==2024.9.6
      - pyyaml==6.0.2
      - pydantic
      - prettytable
      - pillow
      - tqdm
      - joblib
      - seaborn
      - ipykernel
      - ipywidgets
